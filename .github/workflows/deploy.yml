name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master # Spustí se při pushnutí do větve main nebo master

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Přejít do složky s projektem na VPS
            cd /var/www/karbyvisual
            
            # Stáhnout nejnovější verzi kódu z GitHubu
            git pull origin main || git pull origin master
            
            # Znovu sestavit a spustit kontejnery v Dockeru na pozadí
            docker compose up -d --build
